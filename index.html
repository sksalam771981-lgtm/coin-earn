<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineBD HD - Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f0f0f; color: #fff; min-height: 100vh; padding: 20px; }
        
        .container { max-width: 850px; margin: 0 auto; background: #181818; padding: 25px; border-radius: 8px; border: 1px solid #333; }
        h2 { color: #e50914; margin-bottom: 20px; text-align: center; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #ccc; }
        input, select { width: 100%; padding: 10px; background: #222; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 0.9rem; outline: none; }
        input:focus, select:focus { border-color: #e50914; }
        
        .btn { background: #e50914; color: #fff; border: none; padding: 10px 20px; font-size: 1rem; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn:hover { background: #b80710; }
        
        .section-box { background: #141414; padding: 20px; border-radius: 6px; margin-bottom: 25px; border: 1px solid #222; }
        .section-title { font-size: 1.1rem; color: #e50914; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        
        .success-msg { color: #2ecc71; margin-top: 10px; text-align: center; font-weight: bold; }
        .error-msg { color: #e50914; margin-top: 10px; text-align: center; font-weight: bold; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .home-btn { background: #333; color: #fff; text-decoration: none; padding: 8px 15px; border-radius: 4px; font-size: 0.85rem; display: inline-block; margin-bottom: 15px; }
        .home-btn:hover { background: #444; }

        .item-list { max-height: 200px; overflow-y: auto; background: #1c1c1c; padding: 10px; border-radius: 4px; border: 1px solid #333; margin-top: 10px; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #2a2a2a; font-size: 0.9rem; }
        .delete-btn { background: #e50914; color: #fff; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; font-size: 0.8rem; }
        .delete-btn:hover { background: #b80710; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="home-btn"><i class="fa-solid fa-house"></i> মূল সাইটে যান</a>
        <h2><i class="fa-solid fa-user-shield"></i> CineBD HD অ্যাডমিন ড্যাশবোর্ড</h2>
        
        <div class="section-box">
            <div class="section-title">১. ক্যাটাগরি ম্যানেজমেন্ট</div>
            <form id="category-form">
                <div class="form-group">
                    <label>নতুন ক্যাটাগরির নাম</label>
                    <input type="text" id="cat-name" required placeholder="যেমন: Natok, Bollywood">
                </div>
                <button type="submit" class="btn">ক্যাটাগরি সেভ করুন</button>
                <p id="cat-msg" class="success-msg"></p>
            </form>
            
            <label style="margin-top: 15px;">বিদ্যমান ক্যাটাগরি সমূহ (ডিলিট করতে পারবেন):</label>
            <div class="item-list" id="category-list">
                <div style="color: #888; text-align: center; padding: 10px;">লোড হচ্ছে...</div>
            </div>
        </div>

        <div class="section-box">
            <div class="section-title">২. নতুন মুভি বা নাটক আপলোড করুন</div>
            <form id="movie-form">
                <div class="form-group">
                    <label>কনটেন্টের শিরোনাম (Title)</label>
                    <input type="text" id="m-title" required placeholder="মুভি বা নাটকের নাম">
                </div>
                
                <div class="row">
                    <div class="form-group">
                        <label>ক্যাটাগরি সিলেক্ট করুন</label>
                        <select id="m-category" required>
                            <option value="">ক্যাটাগরি লোড হচ্ছে...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>কোয়ালিটি (Quality)</label>
                        <input type="text" id="m-quality" required placeholder="যেমন: 1080p FHD">
                    </div>
                </div>

                <div class="form-group">
                    <label>পোস্টার ইমেজ লিংক (Poster Image URL)</label>
                    <input type="url" id="m-poster" required placeholder="ইমেজ লিংক দিন">
                </div>

                <div class="form-group">
                    <label>টেলিগ্রাম চ্যানেল লিংক (Telegram Link)</label>
                    <input type="url" id="m-telegram" placeholder="https://t.me/...">
                </div>

                <div class="form-group">
                    <label><strong>1080p ডাউনলোড লিংকসমূহ</strong></label>
                    <div class="row">
                        <input type="url" id="p1080-index" placeholder="Index Link">
                        <input type="url" id="p1080-gdx" placeholder="GDxShare Link">
                    </div>
                    <div class="row" style="margin-top: 8px;">
                        <input type="url" id="p1080-terabox" placeholder="TeraBox Link">
                        <input type="url" id="p1080-gofile" placeholder="Gofile Link">
                    </div>
                </div>

                <div class="form-group">
                    <label><strong>720p ডাউনলোড লিংকসমূহ</strong></label>
                    <div class="row">
                        <input type="url" id="p720-index" placeholder="Index Link">
                        <input type="url" id="p720-gdx" placeholder="GDxShare Link">
                    </div>
                    <div class="row" style="margin-top: 8px;">
                        <input type="url" id="p720-terabox" placeholder="TeraBox Link">
                        <input type="url" id="p720-gofile" placeholder="Gofile Link">
                    </div>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label>স্ক্রিনশট ১ (Screenshot 1 URL)</label>
                        <input type="url" id="m-ss1" placeholder="Image URL">
                    </div>
                    <div class="form-group">
                        <label>স্ক্রিনশট ২ (Screenshot 2 URL)</label>
                        <input type="url" id="m-ss2" placeholder="Image URL">
                    </div>
                </div>

                <button type="submit" class="btn" style="margin-top: 10px;">কনটেন্ট পাবলিশ করুন</button>
                <p id="movie-msg" class="success-msg"></p>
                <p id="movie-err" class="error-msg"></p>
            </form>
        </div>

        <div class="section-box">
            <div class="section-title">৩. আপলোডকৃত মুভি বা নাটক মুছুন (Delete Movies)</div>
            <label>ওয়েবসাইটে থাকা কনটেন্ট লিস্ট:</label>
            <div class="item-list" id="movie-list">
                <div style="color: #888; text-align: center; padding: 10px;">লোড হচ্ছে...</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB1ZubF0ZPvtdhcWWBa2PGorU7lx0OkN4I",
            authDomain: "admin-726ec.firebaseapp.com",
            databaseURL: "https://admin-726ec-default-rtdb.firebaseio.com",
            projectId: "admin-726ec",
            storageBucket: "admin-726ec.firebasestorage.app",
            messagingSenderId: "97796496921",
            appId: "1:97796496921:web:4bf82701a35b6caca4d488",
            measurementId: "G-Y8Y7S92HD0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadAdminData() {
            await loadCategories();
            await loadMoviesList();
        }

        async function loadCategories() {
            try {
                const querySnapshot = await getDocs(collection(db, "categories"));
                const select = document.getElementById('m-category');
                const catListDiv = document.getElementById('category-list');
                
                select.innerHTML = '<option value="">ক্যাটাগরি সিলেক্ট করুন</option>';
                catListDiv.innerHTML = '';

                if(querySnapshot.empty) {
                    catListDiv.innerHTML = '<div style="color: #888; text-align: center; padding: 10px;">কোনো ক্যাটাগরি নেই</div>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const cat = docSnap.data().name;
                    const catId = docSnap.id;
                    
                    select.innerHTML += `<option value="${cat}">${cat}</option>`;
                    
                    catListDiv.innerHTML += `
                        <div class="item-row">
                            <span>${cat}</span>
                            <button class="delete-btn" onclick="deleteCategory('${catId}')"><i class="fa-solid fa-trash"></i> ডিলিট</button>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Category Load Error:", err);
            }
        }

        async function loadMoviesList() {
            try {
                const querySnapshot = await getDocs(collection(db, "movies"));
                const movieListDiv = document.getElementById('movie-list');
                movieListDiv.innerHTML = '';

                if(querySnapshot.empty) {
                    movieListDiv.innerHTML = '<div style="color: #888; text-align: center; padding: 10px;">কোনো মুভি বা নাটক আপলোড করা হয়নি</div>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const movie = docSnap.data();
                    const movieId = docSnap.id;

                    movieListDiv.innerHTML += `
                        <div class="item-row">
                            <span><b>${movie.title}</b> (${movie.category})</span>
                            <button class="delete-btn" onclick="deleteMovie('${movieId}')"><i class="fa-solid fa-trash"></i> ডিলিট</button>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Movie Load Error:", err);
            }
        }

        window.deleteCategory = async function(id) {
            if(confirm('আপনি কি নিশ্চিত এই ক্যাটাগরি ডিলিট করতে চান?')) {
                try {
                    await deleteDoc(doc(db, "categories", id));
                    loadAdminData();
                    alert('ক্যাটাগরি সফলভাবে ডিলিট করা হয়েছে!');
                } catch(err) {
                    alert('ডিলিট করতে সমস্যা হয়েছে: ' + err.message);
                }
            }
        }

        window.deleteMovie = async function(id) {
            if(confirm('আপনি কি নিশ্চিত এই কনটেন্ট ডিলিট করতে চান?')) {
                try {
                    await deleteDoc(doc(db, "movies", id));
                    loadAdminData();
                    alert('কনটেন্ট সফলভাবে ডিলিট করা হয়েছে!');
                } catch(err) {
                    alert('ডিলিট করতে সমস্যা হয়েছে: ' + err.message);
                }
            }
        }

        document.getElementById('category-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const catName = document.getElementById('cat-name').value.trim();
            try {
                await addDoc(collection(db, "categories"), { name: catName });
                document.getElementById('cat-msg').innerText = 'সফলভাবে ক্যাটাগরি যোগ করা হয়েছে!';
                document.getElementById('cat-name').value = '';
                loadAdminData();
                setTimeout(() => document.getElementById('cat-msg').innerText = '', 3000);
            } catch (err) {
                alert('ত্রুটি: ' + err.message);
            }
        });

        document.getElementById('movie-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            document.getElementById('movie-err').innerText = '';
            
            const movieData = {
                title: document.getElementById('m-title').value,
                category: document.getElementById('m-category').value,
                quality: document.getElementById('m-quality').value,
                poster: document.getElementById('m-poster').value,
                telegram: document.getElementById('m-telegram').value,
                p1080: {
                    index: document.getElementById('p1080-index').value,
                    gdx: document.getElementById('p1080-gdx').value,
                    terabox: document.getElementById('p1080-terabox').value,
                    gofile: document.getElementById('p1080-gofile').value
                },
                p720: {
                    index: document.getElementById('p720-index').value,
                    gdx: document.getElementById('p720-gdx').value,
                    terabox: document.getElementById('p720-terabox').value,
                    gofile: document.getElementById('p720-gofile').value
                },
                ss1: document.getElementById('m-ss1').value,
                ss2: document.getElementById('m-ss2').value,
                timestamp: new Date()
            };

            try {
                await addDoc(collection(db, "movies"), movieData);
                document.getElementById('movie-msg').innerText = 'সফলভাবে মুভি/নাটক আপলোড করা হয়েছে!';
                document.getElementById('movie-form').reset();
                loadAdminData();
                setTimeout(() => document.getElementById('movie-msg').innerText = '', 3000);
            } catch (err) {
                document.getElementById('movie-err').innerText = 'আপলোড ব্যর্থ হয়েছে: ' + err.message;
            }
        });

        loadAdminData();
    </script>
</body>
</html>
